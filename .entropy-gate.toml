# entropy-gate configuration
# Docs: see README.md in this directory

[settings]
fail_on_unknown_language = true      # unconfigured language => block the commit
max_staged_lines = 1200              # 0 disables; guards against giant AI diffs
parallel = true
# Explicit — same list as the shipped default (node_modules/ and friends live
# there). Vendored npm Go is additionally excluded at the linter itself:
# `run ./...` walks node_modules/**/go packages, which the gate's path filter
# cannot stop (see .golangci.yml exclude-rules).
ignore_paths = ["node_modules/", "dist/", ".scratch/", ".gocache/"]
# ignore_extensions = [".md", ".json"]

[aislop]
enabled = "require"                  # require | optional | off
fail_below = 0                       # block when aislop score drops below this
# The gate excludes its own directory automatically, whatever it is named.
# extra_args = ["--exclude", "some/other/dir"]

[thresholds]
cyclomatic = 10                      # per function
cognitive = 15
function_lines = 30
file_lines = 300
nesting = 3
params = 4
duplication_percent = 3.0

# --- the three configured languages -------------------------------------- #

[languages.python]
enabled = true
# disable = ["vulture"]             # opt out of a single check

[languages.go]
enabled = true

[languages.javascript]
enabled = true
# disable = ["knip"]

# scripts/*.sh are first-class gates (golden, verify-full, the walkthrough):
# classify them so a .sh stage is a syntax check, not an unknown-language block.
[languages.shell]
enabled = true
extensions = [".sh"]
checks = [
  { name = "bash-syntax", scope = "file", command = ["bash", "-n", "{files}"] },]

# The committed event logs under scripts/legacy/ are .jsonl. Without a block
# here, fail_on_unknown_language blocks ANY commit that touches one — including
# a commit that only repairs the fixture — and the message it prints is about
# the language, not about the file being wrong.
[languages.jsonl]
enabled = true
extensions = [".jsonl"]
checks = [
  # Every non-blank line must parse. Exit-code judged, and file scope is right
  # here: a line that does not parse is always an error, so there is no
  # pre-existing-findings ceiling to ratchet. The hash chain over these lines
  # is a different check and lives where it can see the chain: `webv2 verify`,
  # which scripts/verify-full.sh step 9 runs against this very fixture.
  { name = "jsonl-parses", scope = "file", command = ["python3", "-c", "import json,sys\nfor p in sys.argv[1:]:\n for i,l in enumerate(open(p),1):\n  if l.strip():\n   try: json.loads(l)\n   except ValueError as e:\n    print('%s:%d: %s'%(p,i,e)); sys.exit(1)", "{files}"] },
]

