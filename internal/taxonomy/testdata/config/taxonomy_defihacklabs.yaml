# Per-dataset taxonomy aliases: defihacklabs.
# Owned ONLY by the defihacklabs adapter task (file discipline: one dataset,
# one file). Merged on top of config/taxonomy_map.yaml — a dataset-specific
# alias wins over a common one. Values must be a canonical class or
# 'unmapped' (webv2.taxonomy.validate_map_file). Lookup is
# case/whitespace/punctuation-insensitive, so key casing below is cosmetic.
#
# Coverage: the 181 distinct incidents.json `type` labels (recon §4.1) plus
# the 296 RCA atomic labels (recon §4.4, comma-split). Labels already
# resolved by the common map (Price Manipulation, Access Control,
# Reentrancy Attack, Flash Loan Attack, Precision Loss, Reentrancy,
# Flash Loan, Integer Overflow, Oracle Manipulation, Signature Replay,
# Logic Error, Flashloan, Denial Of Service) are NOT repeated here.
# Anything absent resolves via `default: unmapped` — honesty over coverage
# (key-compromise, MEV/sandwich/slippage, randomness, pure-prose labels).
default: unmapped
